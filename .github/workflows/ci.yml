name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: ${{ matrix.build_type }} build on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DROZETA_BUILD_TESTS=ON
          -DROZETA_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run documentation contract
        run: python3 scripts/verify_docs.py

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test examples
        run: |
          ./build/examples/robotour_demo
          ./build/examples/simple_robot_loop
          ./build/examples/gps_reader
          ./build/examples/lidar_scan_console
          ./build/examples/replay_robotour_log tests/fixtures/replay/basic_robotour.csv

      - name: Generate docs when Doxygen is available
        run: |
          if command -v doxygen >/dev/null 2>&1; then
            doxygen Doxyfile
          else
            echo "Doxygen not installed; skipping optional docs generation."
          fi
