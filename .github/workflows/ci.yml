name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: ${{ matrix.build_type }} build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Debug
            cmake_build_type_arg: -DCMAKE_BUILD_TYPE=Debug
          - os: ubuntu-latest
            build_type: Release
            cmake_build_type_arg: -DCMAKE_BUILD_TYPE=Release
          - os: windows-latest
            build_type: Debug
            cmake_build_type_arg: ""
          - os: windows-latest
            build_type: Release
            cmake_build_type_arg: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure CMake
        run: >
          cmake -S . -B build
          ${{ matrix.cmake_build_type_arg }}
          -DROZETA_BUILD_TESTS=ON
          -DROZETA_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2

      - name: Run documentation contract
        run: python scripts/verify_docs.py

      - name: Run tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Smoke test examples
        run: python scripts/smoke_ci_examples.py --build-dir build --config ${{ matrix.build_type }}

      - name: Generate docs when Doxygen is available
        run: python scripts/generate_docs_if_available.py

      - name: Upload CMake logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
